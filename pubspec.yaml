name: flutter_prakash_core
description: "Enterprise-grade Flutter core package & hybrid plugin framework with Clean Architecture, BLoC state management, reactive forms, DevTools, and monetization."
version: 1.0.10
homepage: https://github.com/prakashbahadurchand/flutter_prakash_core
repository: https://github.com/prakashbahadurchand/flutter_prakash_core
issue_tracker: https://github.com/prakashbahadurchand/flutter_prakash_core/issues
documentation: https://github.com/prakashbahadurchand/flutter_prakash_core#readme

topics:
  - state-management
  - clean-architecture
  - devtools
  - admob
  - firebase

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  # Core Utilities & State
  # Dependency Injection
  # REST & GraphQL Networking
  # Firebase Suite
  # Media, PDF & Web
  # System Utilities & Widgets
  # Storage Abstractions
  # Local Notifications
  # UI Design System & Components

  animations: ^3.0.0
  audioplayers: ^6.0.0
  auto_route: ^11.1.0
  bloc: ^9.2.1
  cached_network_image: ^4.0.0
  device_info_plus: ^13.2.0
  dio: ^5.9.2
  dio_cache_interceptor: ^4.0.6
  equatable: ^3.0.0
  faker: ^2.2.0
  file_picker: ^13.1.0
  firebase_analytics: ^12.4.5
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_in_app_messaging: ^0.9.2+6
  firebase_messaging: ^16.4.0
  firebase_performance: ^0.11.4+5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  flutter_pdfview: ^1.4.4
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.0.0
  get_it: ^9.2.1
  google_fonts: ^8.1.0
  gql: ^1.0.0
  gql_exec: ^1.0.0
  gql_link: ^1.0.0
  graphql: ^5.2.4
  graphql_flutter: ^5.3.0
  hive_ce: ^2.19.3
  home_widget: ^0.10.0
  image_picker: ^1.2.2
  in_app_review: ^2.0.12
  in_app_update: ^5.0.0
  infinite_scroll_pagination: ^5.1.1
  injectable: ^3.0.0
  internet_connection_checker_plus: ^3.1.0
  intl: ^0.20.2
  logger: ^2.7.0
  meta: ^1.18.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.0
  pinput: ^6.0.2
  plugin_platform_interface: ^2.0.2
  pretty_dio_logger: ^1.4.0
  qr_flutter: ^4.1.0
  rxdart: ^0.28.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  shimmer: ^4.0.0
  skeletonizer: ^3.0.0
  speech_to_text: ^7.4.0
  timeago: ^3.7.1
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  webview_flutter: ^4.14.0

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.4.14
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3
  injectable_generator: ^3.1.3

flutter:
  plugin:
    platforms:
      android:
        package: com.prakashbahadurchand.flutter_prakash_core
        pluginClass: FpCorePlugin
      ios:
        pluginClass: FpCorePlugin
  uses-material-design: true