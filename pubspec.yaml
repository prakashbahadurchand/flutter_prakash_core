name: flutter_prakash
description: "Ultimate Enterprise Multi-App Core Engine & Hybrid Plugin Framework: REST (Dio), GraphQL, Firebase, Supabase, AdMob, Media, Maps, Storage, Theme, and UI."
version: 0.0.1
homepage: https://github.com/prakashbahadurchand/flutter_prakash

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

  # Core Utilities & State
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  rxdart: ^0.28.0
  intl: ^0.20.2
  timeago: ^3.7.1
  uuid: ^4.5.3
  logger: ^2.7.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # REST & GraphQL Networking
  dio: ^5.9.2
  dio_cache_interceptor: ^4.0.6
  internet_connection_checker_plus: ^3.1.0
  graphql: ^5.2.0-beta.6
  graphql_flutter: ^5.2.0-beta.6

  # Firebase Suite
  firebase_core: ^4.11.0
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6
  firebase_crashlytics: ^5.2.4
  firebase_messaging: ^16.4.0
  firebase_analytics: ^12.4.5
  firebase_remote_config: ^6.5.5

  # Supabase Suite
  supabase_flutter: ^2.8.4

  # AdMob Monetization
  google_mobile_ads: ^9.0.0

  # Media & PDF
  audioplayers: ^6.0.0
  flutter_pdfview: ^1.4.4
  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0

  # Maps & Location
  flutter_map: ^8.3.0
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1

  # System Utilities & Widgets
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  qr_flutter: ^4.1.0
  home_widget: ^0.9.3
  permission_handler: ^13.0.0
  device_info_plus: ^13.2.0
  speech_to_text: ^7.4.0

  # Storage Abstractions
  shared_preferences: ^2.5.5
  hive_ce: ^2.19.3
  path_provider: ^2.1.6

  # Local Notifications
  flutter_local_notifications: ^22.0.1

  # UI Design System & Components
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  skeletonizer: ^2.1.3
  animations: ^2.2.0
  pinput: ^6.0.2
  infinite_scroll_pagination: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.prakashbahadurchand.flutter_prakash
        pluginClass: FlutterPrakashPlugin
      ios:
        pluginClass: FlutterPrakashPlugin
  uses-material-design: true
