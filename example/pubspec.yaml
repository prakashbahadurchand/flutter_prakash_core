name: flutter_prakash_example
description: "Demonstrates how to use the flutter_prakash plugin with Clean Architecture."
publish_to: 'none'

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_prakash:
    path: ../

  # State Management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  rxdart: ^0.28.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.5.0

  # Routing
  auto_route: ^9.3.0

  # Immutable Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.9.2
  dio_cache_interceptor: ^4.0.6
  http: ^1.6.0
  internet_connection_checker_plus: ^3.1.0

  # Firebase
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_messaging: ^16.4.0
  firebase_analytics: ^12.4.5
  firebase_remote_config: ^6.5.5
  firebase_performance: ^0.11.4+5
  firebase_in_app_messaging: ^0.9.2+6

  # Local Storage
  hive_ce: ^2.19.3
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  flutter_secure_storage: ^10.3.1

  # Notifications
  flutter_local_notifications: ^22.0.1

  # Maps
  flutter_map: ^8.3.0
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1

  # Media
  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0
  audioplayers: ^6.0.0
  flutter_pdfview: ^1.4.4

  # UI / UX & Utilities
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  skeletonizer: ^2.1.3
  animations: ^2.2.0
  flutter_hooks: ^0.21.3+1
  fl_chart: ^1.2.0
  equatable: ^2.0.8
  intl: ^0.20.2
  timeago: ^3.7.1
  uuid: ^4.5.3
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  qr_flutter: ^4.1.0
  logger: ^2.7.0
  device_info_plus: ^13.2.0
  faker: ^2.2.0
  pinput: ^6.0.2
  speech_to_text: ^7.4.0
  infinite_scroll_pagination: ^5.1.1
  home_widget: ^0.9.3
  permission_handler: ^13.0.0
  path: ^1.9.1
  device_preview: ^1.2.0
  google_mobile_ads: ^9.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  auto_route_generator: ^9.3.1
  injectable_generator: ^2.7.0
  freezed: ^2.5.8
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
